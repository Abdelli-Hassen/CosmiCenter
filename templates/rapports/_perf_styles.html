<style>
.perf-page { padding: 28px 36px; max-width: 1400px; margin: 0 auto; }
@media (max-width:768px) { .perf-page { padding: 16px; } }

.perf-hero { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:20px; }
.perf-title { font-size:28px; font-weight:900; color:var(--text-primary); letter-spacing:-0.03em; margin:0; }
.perf-sub { font-size:14px; color:var(--text-muted); margin:6px 0 0; }
.perf-seg { display:flex; gap:4px; padding:4px; background:var(--surface-2); border:1px solid var(--border-default); border-radius:12px; }
.perf-seg a { padding:6px 14px; border-radius:8px; font-size:13px; font-weight:700; text-decoration:none; color:var(--text-muted); border:1px solid transparent; }
.perf-seg a:hover { color:var(--text-secondary); }
.perf-seg a.active { background:var(--surface-1); color:var(--text-primary); border-color:var(--border-subtle); box-shadow:0 1px 4px rgba(0,0,0,.08); }
.back-link { display:inline-flex; align-items:center; gap:8px; padding:8px 16px; font-size:14px; font-weight:600; border-radius:12px; text-decoration:none; color:var(--text-primary); background:var(--surface-2); border:1px solid var(--border-subtle); margin-bottom:16px; }

/* Tuiles */
.tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:14px; margin-bottom:22px; }
.tiles.six { grid-template-columns:repeat(6, 1fr); }
@media (max-width:1200px) { .tiles.six { grid-template-columns:repeat(3, 1fr); } }
@media (max-width:640px) { .tiles.six { grid-template-columns:repeat(2, 1fr); } }
.tiles.six .tile { padding:14px 14px; }
.tiles.six .tile-value { font-size:26px; }
.tiles.three { grid-template-columns:repeat(3, 1fr); }
@media (max-width:700px) { .tiles.three { grid-template-columns:repeat(2, 1fr); } }
.tile { background:var(--surface-1); border:1px solid var(--border-subtle); border-radius:16px; padding:16px 18px; display:flex; flex-direction:column; gap:6px; }
.tile-label { font-size:12.5px; font-weight:700; color:var(--text-secondary); display:flex; align-items:center; gap:6px; }
.tile-value { font-size:30px; font-weight:900; color:var(--text-primary); letter-spacing:-0.03em; line-height:1.05; }
.tile-note { font-size:12px; color:var(--text-muted); }
.tile.is-hot .tile-value { color:#ef4444; }

/* Cartes et tableaux */
.pcard { background:var(--surface-1); border:1px solid var(--border-subtle); border-radius:16px; overflow:hidden; margin-bottom:22px; }
.card-head { padding:16px 20px 12px; border-bottom:1px solid var(--border-subtle); }
.card-head h2 { font-size:16px; font-weight:800; color:var(--text-primary); margin:0; }
.card-head p { font-size:12.5px; color:var(--text-muted); margin:4px 0 0; }
.ptable { width:100%; border-collapse:collapse; font-size:13.5px; }
.ptable th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); font-weight:700; padding:10px 14px; border-bottom:1px solid var(--border-subtle); white-space:nowrap; }
.ptable td { padding:12px 14px; border-bottom:1px solid var(--border-subtle); color:var(--text-secondary); vertical-align:middle; }
.ptable tr:last-child td { border-bottom:none; }
.ptable .num { text-align:right; font-variant-numeric:tabular-nums; }
.ptable th.num { text-align:right; }
.ptable .strong { color:var(--text-primary); font-weight:700; }
.ptable tr.click { cursor:pointer; }
.ptable tr.click:hover { background:var(--surface-2); }
.scroll { overflow-x:auto; }
.empty { text-align:center; padding:34px 16px; color:var(--text-muted); font-size:14px; font-weight:600; }

/* Pastilles */
.pill { font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:7px; display:inline-block; white-space:nowrap; }
.pill.good { background:rgba(16,185,129,.13); color:#10b981; }
.pill.warn { background:rgba(245,158,11,.15); color:#f59e0b; }
.pill.bad { background:rgba(239,68,68,.13); color:#ef4444; }
.pill.muted { background:var(--surface-2); color:var(--text-muted); }

/* Avatar */
.av { width:38px; height:38px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border-subtle); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:var(--text-secondary); overflow:hidden; flex-shrink:0; }
.av img { width:100%; height:100%; object-fit:cover; }
.av.big { width:64px; height:64px; font-size:22px; }
.who { display:flex; align-items:center; gap:12px; min-width:0; }
.who-name { font-weight:800; color:var(--text-primary); }
.who-sub { font-size:12px; color:var(--text-muted); }
.rank { font-weight:900; color:var(--text-muted); width:28px; text-align:center; }
.go { color:var(--text-muted); font-size:18px; }
.sentence { font-size:15.5px; line-height:1.6; color:var(--text-secondary); background:var(--surface-1); border:1px solid var(--border-subtle); border-radius:14px; padding:16px 20px; margin-bottom:20px; }
.sentence strong { color:var(--text-primary); }

/* Podium */
.podium-title { font-size:16px; font-weight:800; color:var(--text-primary); display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.podium-ico { width:30px; height:30px; border-radius:8px; background:rgba(245,158,11,.12); color:#f59e0b; display:inline-flex; align-items:center; justify-content:center; font-size:16px; }
.podium-sub { font-size:12.5px; font-weight:500; color:var(--text-muted); }
.podium { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-bottom:22px; }
@media (max-width:900px) { .podium { grid-template-columns:1fr; } }
.podium-card { position:relative; display:flex; flex-direction:column; gap:16px; padding:20px 22px; border-radius:18px; background:var(--surface-1); border:1px solid var(--border-subtle); text-decoration:none; overflow:hidden; transition:transform .2s, box-shadow .2s, border-color .2s; }
.podium-card:hover { transform:translateY(-3px); box-shadow:0 12px 26px rgba(0,0,0,.18); border-color:var(--brand); }
.podium-card[data-rank="1"] { border-color:rgba(245,158,11,.55); box-shadow:0 0 0 1px rgba(245,158,11,.25) inset; }
.podium-rank { position:absolute; top:12px; right:18px; font-size:44px; font-weight:900; line-height:1; opacity:.16; }
.podium-card[data-rank="1"] .podium-rank { color:#f59e0b; }
.podium-card[data-rank="2"] .podium-rank { color:#94a3b8; }
.podium-card[data-rank="3"] .podium-rank { color:#cd7c1e; }
.podium-av { width:56px; height:56px; font-size:19px; border:2px solid var(--surface-2); }
.podium-card[data-rank="1"] .podium-av { border-color:#f59e0b; }
.podium-name { font-size:17px; font-weight:800; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.podium-stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; padding-top:14px; border-top:1px solid var(--border-subtle); }
.podium-val { font-size:24px; font-weight:900; color:var(--text-primary); letter-spacing:-0.02em; line-height:1.1; }
.podium-lbl { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
/* ── Animations (entrées + survols) ─────────────────────────── */
@keyframes slide-up { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes fade-in-up { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

.perf-hero { animation: fade-in-up .5s ease-out; }
.podium-title { animation: fade-in-up .5s ease-out .1s backwards; }
.podium-card { animation: slide-up .6s cubic-bezier(.16,1,.3,1) backwards; transition: all .4s cubic-bezier(.16,1,.3,1); }
.podium-card:nth-child(1) { animation-delay:.10s; }
.podium-card:nth-child(2) { animation-delay:.18s; }
.podium-card:nth-child(3) { animation-delay:.26s; }
.sentence { animation: fade-in-up .5s ease-out .1s backwards; }
.tiles .tile { animation: slide-up .55s cubic-bezier(.16,1,.3,1) backwards; transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease, border-color .3s ease; }
.tiles .tile:nth-child(1) { animation-delay:.12s; } .tiles .tile:nth-child(2) { animation-delay:.17s; }
.tiles .tile:nth-child(3) { animation-delay:.22s; } .tiles .tile:nth-child(4) { animation-delay:.27s; }
.tiles .tile:nth-child(5) { animation-delay:.32s; } .tiles .tile:nth-child(6) { animation-delay:.37s; }
.tiles .tile:hover { transform:translateY(-4px); box-shadow:0 12px 24px rgba(0,0,0,.16); border-color:rgba(var(--brand-rgb, 232,33,63), .35); }
.pcard { animation: slide-up .6s cubic-bezier(.16,1,.3,1) .2s backwards; }

/* Boutons de période */
.perf-seg a { transition: all .25s cubic-bezier(.34,1.56,.64,1); }
.perf-seg a:not(.active):hover { color:var(--text-primary); background:rgba(255,255,255,.08); transform:translateY(-1px); }
.perf-seg a.active { transform:scale(1.05); }
.back-link { transition: all .25s ease; }
.back-link:hover { transform:translateX(-3px); border-color:var(--brand); }

/* Podium : survol */
.podium-card::before { content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
  background:linear-gradient(135deg, var(--brand), transparent 60%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude;
  opacity:0; transition:opacity .4s ease; pointer-events:none; }
.podium-card:hover { transform:translateY(-6px) scale(1.02); box-shadow:0 16px 32px rgba(0,0,0,.22); }
.podium-card:hover::before { opacity:1; }
.podium-rank { transition: all .3s ease; }
.podium-card:hover .podium-rank { transform:scale(1.12) rotate(5deg); opacity:.28; }
.podium-av { transition: transform .3s ease, border-color .3s ease; }
.podium-card:hover .podium-av { transform:scale(1.1); border-color:var(--brand); }
.podium-name { transition: color .2s ease; }
.podium-card:hover .podium-name { color:var(--brand); }
.podium-stats { transition: border-color .3s ease; }
.podium-card:hover .podium-stats { border-color:rgba(var(--brand-rgb, 232,33,63), .3); }
.podium-val { transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
.podium-card:hover .podium-val { transform:translateY(-3px); }

/* Tableaux : lignes cliquables */
.ptable tbody tr { animation: fade-in-up .4s ease-out backwards; }
.ptable tbody tr:nth-child(1) { animation-delay:.25s; } .ptable tbody tr:nth-child(2) { animation-delay:.29s; }
.ptable tbody tr:nth-child(3) { animation-delay:.33s; } .ptable tbody tr:nth-child(4) { animation-delay:.37s; }
.ptable tbody tr:nth-child(5) { animation-delay:.41s; } .ptable tbody tr:nth-child(n+6) { animation-delay:.45s; }
.ptable tr.click { transition: background .25s ease, transform .3s cubic-bezier(.16,1,.3,1); }
.ptable tr.click:hover { transform:translateX(4px); box-shadow:inset 3px 0 0 var(--brand); }
.ptable tr.click .av { transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s ease; }
.ptable tr.click:hover .av { transform:scale(1.12); box-shadow:0 4px 12px rgba(0,0,0,.18); }
.ptable tr.click .who-name { transition: color .2s ease; }
.ptable tr.click:hover .who-name, .ptable tr.click:hover td.strong { color:var(--brand); }
.ptable tr.click .num { transition: transform .2s ease; }
.ptable tr.click:hover .num { transform:scale(1.06); }
.ptable tr.click .pill { transition: transform .2s ease, box-shadow .2s ease; }
.ptable tr.click:hover .pill { transform:scale(1.06); box-shadow:0 2px 8px rgba(0,0,0,.12); }
.go { opacity:.35; transition: all .3s cubic-bezier(.34,1.56,.64,1); }
.ptable tr.click:hover .go { opacity:1; color:var(--brand); transform:translateX(5px); }

@media (prefers-reduced-motion: reduce) {
  .perf-hero, .podium-title, .podium-card, .sentence, .tiles .tile, .pcard, .ptable tbody tr { animation:none !important; }
  .podium-card:hover, .tiles .tile:hover, .ptable tr.click:hover { transform:none; }
}</style>
