{# Sélection de plusieurs PDV. Variables : pdvs (liste), pdv_selected (liste d'ids cochés). Le 1er coché = PDV principal. #}
<style>
.pdv-multi { border:1px solid var(--border-subtle); border-radius:12px; background:var(--surface-2); max-height:190px; overflow-y:auto; padding:6px; }
.pdv-multi label { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600; color:var(--text-primary); transition:background .15s; }
.pdv-multi label:hover { background:var(--surface-3); }
.pdv-multi input { accent-color:var(--brand); width:16px; height:16px; }
.pdv-multi small { color:var(--text-muted); font-weight:500; }
.pdv-multi-hint { font-size:12px; color:var(--text-muted); margin-top:6px; }
</style>
<div class="input-group" style="margin-bottom:0;">
  <label class="input-label">Points de Vente (PDV)</label>
  <div class="pdv-multi">
    {% for p in pdvs %}
    <label>
      <input type="checkbox" name="pdv_ids" value="{{ p.id }}" {% if p.id|string in pdv_selected %}checked{% endif %}>
      <span>{{ p.nom }} <small>({{ p.ville or p.categorie or 'PDV' }})</small></span>
    </label>
    {% else %}
    <small style="padding:8px;">Aucun point de vente actif.</small>
    {% endfor %}
  </div>
  <div class="pdv-multi-hint">Cochez un ou plusieurs PDV. Aucun = Siège / HQ. Le premier de la liste est le PDV principal.</div>
</div>
