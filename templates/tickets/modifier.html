{% extends "base.html" %}

{% block title %}Modifier {{ ticket.numero }}{% endblock %}

{% block body_class %}page-ticket-edit{% endblock %}

{% block content %}
<div class="page">

  <!-- Page Header -->
  <div class="page-header" style="max-width: 800px; margin: 0 auto; padding-top: 32px; padding-bottom: 24px;">
    <div class="page-header-left">
      <nav class="breadcrumb" aria-label="Fil d'Ariane">
        <a href="{{ url_for('tickets.liste') }}" class="breadcrumb-link">Tous les tickets</a>
        <span class="breadcrumb-sep">/</span>
        <a href="{{ url_for('tickets.detail', ticket_id=ticket.id) }}" class="breadcrumb-link"
           style="font-family:var(--font-mono);font-size:12px;">{{ ticket.numero }}</a>
        <span class="breadcrumb-sep">/</span>
        <span class="breadcrumb-current">Modifier</span>
      </nav>
      <h1 class="page-title" style="margin-top: 8px; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, var(--text-primary) 0%, var(--text-muted) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.02em;">Modifier {{ ticket.numero }}</h1>
    </div>
  </div>

  <!-- Form Card -->
  <div class="page-body" style="max-width: 800px; margin: 0 auto; padding-bottom: 80px;">
    <div class="card card-raised" style="border-radius: 16px; border: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm); overflow: hidden;">
      <div class="card-body" style="padding: 32px;">

        <form method="POST" action="{{ url_for('tickets.modifier', ticket_id=ticket.id) }}" id="editForm">

          <!-- Title -->
          <div class="form-group" style="margin-bottom:24px;">
            <label class="form-label" for="titre">
              Titre <span style="color:var(--color-brand,#dc2626);">*</span>
            </label>
            <input
              type="text"
              id="titre"
              name="titre"
              class="input"
              value="{{ ticket.titre }}"
              required
              autofocus
              style="font-size:15px;font-weight:500;padding:13px 16px;"
            >
          </div>

          <!-- Description -->
          <div class="form-group" style="margin-bottom:24px;">
            <label class="form-label" for="description">Description</label>
            <textarea
              id="description"
              name="description"
              class="textarea"
              rows="7"
              placeholder="Décrivez le problème en détail..."
              style="resize:vertical;min-height:140px;"
            >{{ ticket.description or '' }}</textarea>
          </div>

          <!-- Status + Priority (2 cols) -->
          <div class="form-row" style="margin-bottom: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
            <div class="form-group">
              <label class="form-label" for="statut">Statut</label>
              <div class="select-wrap">
                <select id="statut" name="statut" class="select" style="height:42px; border-radius:10px;">
                  <option value="nouveau"    {% if ticket.statut == 'nouveau' %}selected{% endif %}>Nouveau</option>
                  <option value="ouvert"     {% if ticket.statut == 'ouvert' %}selected{% endif %}>Ouvert</option>
                  <option value="en_cours"   {% if ticket.statut == 'en_cours' %}selected{% endif %}>En cours</option>
                  <option value="en_attente" {% if ticket.statut == 'en_attente' %}selected{% endif %}>En attente</option>
                  <option value="resolu"     {% if ticket.statut == 'resolu' %}selected{% endif %}>Résolu</option>
                  <option value="ferme"      {% if ticket.statut == 'ferme' %}selected{% endif %}>Fermé</option>
                  <option value="annule"     {% if ticket.statut == 'annule' %}selected{% endif %}>Annulé</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="priorite">Priorité</label>
              <div class="select-wrap">
                <select id="priorite" name="priorite" class="select" style="height:42px; border-radius:10px;">
                  <option value="basse"    {% if ticket.priorite == 'basse' %}selected{% endif %}>Basse</option>
                  <option value="moyenne"  {% if ticket.priorite == 'moyenne' %}selected{% endif %}>Moyenne</option>
                  <option value="haute"    {% if ticket.priorite == 'haute' %}selected{% endif %}>Haute</option>
                  <option value="urgente"  {% if ticket.priorite == 'urgente' %}selected{% endif %}>Urgente</option>
                  <option value="critique" {% if ticket.priorite == 'critique' %}selected{% endif %}>Critique</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Department + Assignee (2 cols) -->
          <div class="form-row" style="margin-bottom: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
            <div class="form-group">
              <label class="form-label" for="departement_id">Département</label>
              <div class="select-wrap">
                <select id="departement_id" name="departement_id" class="select" style="height:42px; border-radius:10px;">
                  <option value="">Aucun département</option>
                  {% for dept in departements %}
                  <option value="{{ dept.id }}"
                    {% if ticket.departement and ticket.departement.id == dept.id %}selected{% endif %}>
                    {{ dept.nom }}
                  </option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="assigne_a_id">Assigné à</label>
              <div class="select-wrap">
                <select id="assigne_a_id" name="assigne_a_id" class="select" style="height:42px; border-radius:10px;">
                  <option value="">Non assigné</option>
                  {% for u in utilisateurs %}
                  <option value="{{ u.id }}"
                    {% if ticket.assigne_a_id is defined and ticket.assigne_a_id == u.id %}selected
                    {% elif ticket.assigne_a and ticket.assigne_a.id == u.id %}selected{% endif %}>
                    {{ u.prenom }} {{ u.nom }}
                  </option>
                  {% endfor %}
                </select>
              </div>
            </div>
          </div>

          <!-- Category -->
          <div class="form-group" style="margin-bottom:32px;">
            <label class="form-label" for="categorie_id">Catégorie</label>
            <div class="select-wrap">
              <select id="categorie_id" name="categorie_id" class="select" style="height:42px; border-radius:10px;">
                <option value="">Aucune catégorie</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}"
                  {% if ticket.categorie and ticket.categorie.id == cat.id %}selected{% endif %}>
                  {{ cat.nom }}
                </option>
                {% endfor %}
              </select>
            </div>
          </div>

          <!-- Form Actions -->
          <div class="form-actions" style="position: sticky; bottom: 24px; z-index: 100; display: flex; align-items: center; justify-content: flex-end; gap: 16px; margin-top: 40px; padding: 20px 24px; background: color-mix(in srgb, var(--surface-1) 85%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid var(--border-subtle); box-shadow: 0 12px 32px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.08);">
            <a href="{{ url_for('tickets.detail', ticket_id=ticket.id) }}" class="btn btn-ghost" style="color: var(--text-secondary); font-weight: 600;">Annuler</a>
            <button type="submit" class="btn btn-primary btn-lg" style="box-shadow: 0 8px 16px rgba(220, 38, 38, 0.25); transition: transform 0.2s ease, box-shadow 0.2s ease;" onmouseover="this.style.transform='translateY(-1px)'; this.style.boxShadow='0 12px 20px rgba(220, 38, 38, 0.3)';" onmouseout="this.style.transform='none'; this.style.boxShadow='0 8px 16px rgba(220, 38, 38, 0.25)';">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right: 6px;"><polyline points="20 6 9 17 4 12"/></svg>
              Enregistrer les modifications
            </button>
          </div>

        </form>
      </div><!-- /card-body -->
    </div><!-- /card -->
  </div>

</div><!-- /page -->
{% endblock %}
