{% extends "base.html" %}
{% block title %}Requête invalide{% endblock %}
{% block content %}
<div style="max-width:520px;margin:80px auto;text-align:center;padding:0 16px;">
  <h1 style="font-size:22px;margin-bottom:12px;">Requête invalide ou session expirée</h1>
  <p style="color:var(--text-muted);line-height:1.6;margin-bottom:24px;">
    Votre session de sécurité a expiré ou la requête est incorrecte. Rechargez la page puis recommencez.
  </p>
  <a href="javascript:history.back()" class="btn btn-secondary">Retour</a>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Accueil</a>
</div>
{% endblock %}
