{% extends "base.html" %}

{% block title %}Nouvelle Catégorie - Base de connaissance{% endblock %}
{% block body_class %}page-base-connaissance{% endblock %}

{% block content %}
<div style="padding: 40px; max-width: 800px; margin: 0 auto; animation: fade-in 0.4s ease-out;">
    <div style="display:flex; align-items:center; gap:20px; margin-bottom: 40px;">
        <a href="{{ url_for('base_connaissance.index') }}" class="btn btn-secondary" style="border-radius: 50%; width: 44px; height: 44px; padding: 0; display: inline-flex; align-items: center; justify-content: center; background: var(--surface-2); border: 1px solid var(--border-subtle); color: var(--text-muted); transition: all 0.2s;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <div>
            <h1 style="font-size:32px; font-weight:800; color:var(--text-primary); margin:0; letter-spacing: -0.5px;">Créer une catégorie</h1>
            <p style="color: var(--text-muted); margin: 6px 0 0 0; font-size: 15px;">Ajoutez un nouveau dossier pour organiser les articles.</p>
        </div>
    </div>

    <form method="POST" style="background: rgba(30, 30, 35, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.2);">
        
        <div style="display: flex; flex-direction: column; gap: 24px; margin-bottom: 40px;">
            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label for="nom" style="font-size:14px; font-weight:600; color:var(--text-primary); text-transform: uppercase; letter-spacing: 0.5px;">Nom de la catégorie</label>
                <input type="text" id="nom" name="nom" required placeholder="Ex: Support Client..." style="width:100%; background: var(--surface-base); border: 1px solid var(--border-subtle); padding: 16px 20px; border-radius: 12px; color: var(--text-primary); font-size: 16px; outline: none; transition: all 0.2s box-shadow;" onfocus="this.style.borderColor='var(--brand)'; this.style.boxShadow='0 0 0 3px rgba(255, 51, 102, 0.15)'" onblur="this.style.borderColor='var(--border-subtle)'; this.style.boxShadow='none'">
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label for="description" style="font-size:14px; font-weight:600; color:var(--text-primary); text-transform: uppercase; letter-spacing: 0.5px;">Description (optionnel)</label>
                <input type="text" id="description" name="description" placeholder="Courte description de ce que contient cette catégorie..." style="width:100%; background: var(--surface-base); border: 1px solid var(--border-subtle); padding: 16px 20px; border-radius: 12px; color: var(--text-primary); font-size: 16px; outline: none; transition: all 0.2s box-shadow;" onfocus="this.style.borderColor='var(--brand)'; this.style.boxShadow='0 0 0 3px rgba(255, 51, 102, 0.15)'" onblur="this.style.borderColor='var(--border-subtle)'; this.style.boxShadow='none'">
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
                <label for="icone" style="font-size:14px; font-weight:600; color:var(--text-primary); text-transform: uppercase; letter-spacing: 0.5px;">Icône</label>
                <div style="position: relative;">
                    <select id="icone" name="icone" required style="width:100%; background: var(--surface-base); border: 1px solid var(--border-subtle); padding: 16px 20px; border-radius: 12px; color: var(--text-primary); font-size: 16px; outline: none; appearance: none; cursor: pointer; transition: all 0.2s;" onfocus="this.style.borderColor='var(--brand)'; this.style.boxShadow='0 0 0 3px rgba(255, 51, 102, 0.15)'" onblur="this.style.borderColor='var(--border-subtle)'; this.style.boxShadow='none'">
                        <option value="folder">Dossier (Par défaut)</option>
                        <option value="monitor">Écran / Tech</option>
                        <option value="users">Utilisateurs / RH</option>
                        <option value="dollar-sign">Finance / Argent</option>
                        <option value="book">Livre / Guide</option>
                        <option value="settings">Paramètres / Outils</option>
                        <option value="shield">Sécurité / Bouclier</option>
                    </select>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); pointer-events: none;"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </div>
            </div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:16px; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 30px;">
            <a href="{{ url_for('base_connaissance.index') }}" class="btn btn-secondary" style="padding:14px 28px; border-radius: 12px; font-weight: 600; background: rgba(255,255,255,0.05); border: none;">Annuler</a>
            <button type="submit" class="btn btn-primary" style="padding:14px 32px; border-radius: 12px; font-weight: 600; background: linear-gradient(135deg, var(--brand), #ff5e7e); box-shadow: 0 4px 15px rgba(255, 51, 102, 0.3); border: none;">Créer la catégorie</button>
        </div>
    </form>
</div>
<style>
@keyframes fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.btn-secondary:hover { background: rgba(255,255,255,0.1) !important; color: white !important; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 51, 102, 0.4) !important; }
</style>
{% endblock %}
